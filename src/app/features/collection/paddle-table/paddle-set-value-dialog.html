<h2 mat-dialog-title class="value-dialog-title">
  <span class="value-dialog-icon" aria-hidden="true"><mat-icon>euro</mat-icon></span>
  <span>
    <span class="value-dialog-kicker">Paddle</span>
    <span class="value-dialog-heading">Einsatz ändern</span>
  </span>
</h2>

<mat-dialog-content>
  <p class="value-dialog-intro">Der neue Betrag gilt für zukünftige Spiele.</p>

  <mat-form-field appearance="outline" class="value-field">
    <mat-label>Betrag pro Spiel</mat-label>
    <input
      matInput
      type="text"
      inputmode="decimal"
      autocomplete="off"
      [(ngModel)]="amountInput"
      (keyup.enter)="save()"
      aria-describedby="value-hint"
    />
    <span matSuffix>€</span>
    <!-- <mat-hint id="value-hint">Komma oder Punkt</mat-hint> -->
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Abbrechen</button>
  <button mat-flat-button color="primary" type="button" [disabled]="!isValid" (click)="save()">
    Betrag speichern
  </button>
</mat-dialog-actions>
